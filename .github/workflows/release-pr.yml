name: Release PR

# Maintains one standing release PR per package (agentic-engineering,
# marketing) based on merged Conventional Commit titles. Merging a generated
# release PR is what cuts that package's tag + GitHub Release — see
# docs/solutions/plugin-versioning-requirements.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      # A PR authored by GITHUB_TOKEN cannot trigger workflows (GitHub's
      # anti-recursion rule), so CI on the release PR lands as
      # `action_required` and a human must click "Approve and run" before
      # the required `test` check can report. Authoring under the release
      # App's short-lived installation token removes that gate without a
      # standing PAT. The App needs Contents and Pull requests read/write
      # on this repo.
      # SHA-pinned per docs/solutions/security-issues/hardening-scaffolded-github-actions-workflows.md
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
